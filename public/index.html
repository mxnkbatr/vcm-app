<!DOCTYPE html>
<html lang="mn">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no"
    />
    <meta name="color-scheme" content="light" />
    <meta name="theme-color" content="#FBF8F3" />
    <title>Volunteer Center Mongolia</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 12px;
        padding: 24px;
        background: #fbf8f3;
        color: #142433;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      }
      .logo {
        width: 56px;
        height: 56px;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(11, 132, 229, 0.18);
      }
      .title {
        font-size: 15px;
        font-weight: 800;
        letter-spacing: -0.2px;
      }
      .sub {
        font-size: 12px;
        color: #728596;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 2.5px solid rgba(11, 132, 229, 0.15);
        border-top-color: #0b84e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <img class="logo" src="/branding/icon-192.png" alt="VCM" />
    <div class="title">VCM</div>
    <div class="sub">Ачааллаж байна...</div>
    <div class="spinner" aria-hidden="true"></div>
  </body>
</html>
